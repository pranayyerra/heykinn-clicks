name: DCO

on:
  pull_request:

# Read-only, and no secrets are referenced anywhere in this workflow.
permissions:
  contents: read

concurrency:
  group: dco-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign-off-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check every commit is signed off
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format='%B' "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha is missing a 'Signed-off-by' line (see CONTRIBUTING.md)"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          if [ "$missing" -ne 0 ]; then
            echo "One or more commits are not signed off. Use 'git commit -s', or 'git rebase --signoff $base' to fix existing commits."
            exit 1
          fi
