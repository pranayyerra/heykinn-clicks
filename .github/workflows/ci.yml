name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only, and no secrets are referenced anywhere in this workflow. A PR
# from a fork must never be able to reach a signing identity or credential.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pin to the newest available Xcode on the runner rather than whatever
      # the image defaults to, since this project tracks a recent toolchain.
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_$(ls /Applications | grep -oE 'Xcode_[0-9.]+' | sed 's/Xcode_//' | sort -V | tail -1).app

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Syntax-check packaging scripts
        run: |
          set -euo pipefail
          for script in Packaging/*.sh; do
            echo "checking $script"
            bash -n "$script"
          done
